<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="line-liff-id" content="">
  <title>Hana Scent Artist｜電子名片</title>
  <link rel="canonical" href="https://hanascent.com/card/">
  <link rel="icon" href="/assets/logo-mark-96.png">
  <link rel="stylesheet" href="/assets/style.css">
  <meta property="og:title" content="Hana Scent Artist｜電子名片">
  <meta property="og:description" content="創作與教育・品牌與產品開發">
  <meta property="og:url" content="https://hanascent.com/card/">
  <meta property="og:image" content="https://hanascent.com/assets/logo%E9%BB%91.png">
  <style>
    body { margin: 0; background: #fff; color: #111; }
    .card, .qr-dialog { font-family: 'Noto Serif TC', 'Source Han Serif TC', 'Source Han Serif', '思源宋體', 'Songti TC', 'PMingLiU', serif; color: #111; font-size: 1.25rem; }
    @media (max-width: 600px) { .card, .qr-dialog { font-size: 1.1875rem; } }
    .card { box-sizing: border-box; max-width: 480px; margin: auto; padding: 24px 20px 32px; text-align: center; }
    .card-brand { display: flex; align-items: center; justify-content: center; gap: 8px; padding-bottom: 14px; border-bottom: 1px solid #dedede; }
    .card-brand img { width: 40px; height: 40px; object-fit: contain; }
    .card-brand span { font-family: 'Cormorant Garamond', serif; font-size: clamp(17px, 5vw, 24px); letter-spacing: .1em; font-weight: 600; }
    .card-portrait { display: block; width: 160px; height: 186px; object-fit: cover; margin: 22px auto 14px; }
    .card h1 { font: inherit; font-size: 2.15rem; line-height: 1.25; margin: 0 0 8px; }
    .card h1 span { font-family: 'Cormorant Garamond', serif; }
    .card p { margin: 0; }
    .card-services { border-block: 1px solid #dedede; padding: 16px 0; margin: 21px 0; }
    .card-services h2 { font-size: inherit; line-height: 1.6; font-weight: 600; margin: 0 0 8px; }
    .card-services ul { list-style: none; padding: 0; margin: 0; font-size: inherit; line-height: 1.75; }
    .card-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .card-action { box-sizing: border-box; display: flex; align-items: center; justify-content: center; min-height: 46px; padding: 7px; border: 1px solid #c9c9c9; color: #111; background: #fff; font: inherit; font-size: 1.125rem; line-height: 1.35; text-decoration: none; cursor: pointer; }
    .card-action:hover, .card-action:focus-visible { border-color: #111; }
    .card-action:focus-visible { outline: 2px solid #111; outline-offset: 2px; }
    .card-action-primary { grid-column: 1 / -1; color: #fff; background: #111; border-color: #111; }
    .card .card-status { min-height: 1.5em; margin: 10px 0; color: #555; }
    .card-studio { border-top: 1px solid #dedede; padding-top: 14px; color: #555; font-size: 1.125rem; }
    .qr-dialog { position: fixed; inset: 0; box-sizing: border-box; width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; padding: 20px; border: 0; background: #fff; text-align: center; overflow: auto; }
    .qr-dialog[open] { display: grid; justify-items: center; align-content: safe center; gap: 10px; }
    .qr-dialog h2, .qr-dialog p { margin: 0; }
    .qr-dialog img { width: min(100%, 430px, 62vh); height: auto; image-rendering: pixelated; }
    .qr-dialog button { min-width: 110px; }
    body:has(.qr-dialog[open]) { overflow: hidden; }
  </style>
</head>
<body>
  <main class="card">
    <header class="card-brand">
      <img src="/assets/logo%E9%BB%91.png" width="40" height="40" alt="">
      <span>HANA SCENT ARTIST</span>
    </header>
    <img class="card-portrait" src="./portrait.jpg" width="160" height="186" alt="Hana 沈秉儀">
    <h1><span>Hana</span> 沈秉儀</h1>
    <p id="card-role">創辦人｜調香師｜嗅覺藝術家</p>
    <section class="card-services">
      <h2>創作與教育・品牌與產品開發</h2>
      <ul>
        <li>香氛品牌孵化・氣味研發</li>
        <li>香氛與日化產品開發</li>
        <li>OEM／ODM 代工整合</li>
        <li>專業調香教育・企業團體課程</li>
      </ul>
    </section>
    <nav class="card-actions" aria-label="聯絡與分享">
      <a class="card-action" id="phone" href="tel:+886918682098">電話聯絡</a>
      <a class="card-action" id="line-contact" href="https://line.me/R/ti/p/~helga0417">LINE 聯絡</a>
      <a class="card-action" id="website" href="https://hanascent.com/">官方網站</a>
      <a class="card-action" id="instagram" href="https://www.instagram.com/hanas.scent/">Instagram</a>
      <a class="card-action" href="mailto:hanasscent@gmail.com">Email</a>
      <a class="card-action" href="./hana.vcf" download="hana.vcf">儲存聯絡人</a>
      <button class="card-action" type="button" id="copy-line" data-line-id="helga0417">複製 LINE ID</button>
      <a class="card-action card-action-primary" id="line-share" href="https://line.me/R/share?text=Hana%20Scent%20Artist%20https%3A%2F%2Fhanascent.com%2Fcard%2F">用 LINE 分享名片</a>
      <button class="card-action" type="button" id="native-share">手機分享</button>
      <button class="card-action" type="button" id="copy-url">複製名片網址</button>
      <button class="card-action" type="button" id="show-qr">顯示 QR Code</button>
    </nav>
    <p class="card-status" id="card-status" role="status"></p>
    <footer class="card-studio">藏花香徑工作室</footer>
  </main>
  <dialog class="qr-dialog" id="qr-dialog" aria-labelledby="qr-title">
    <h2 id="qr-title">掃描 QR Code 開啟名片</h2>
    <img src="./qr.png" width="444" height="444" alt="https://hanascent.com/card/">
    <p>hanascent.com/card/</p>
    <form method="dialog"><button class="card-action" type="submit" autofocus>關閉</button></form>
  </dialog>
  <script src="./card.js" defer></script>
</body>
</html>

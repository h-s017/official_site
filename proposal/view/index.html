</style></head><body><main><header><strong>HANA SCENT ARTIST</strong><button onclick="window.print()">列印 / PDF</button></header><section id="missing" hidden>此報價尚未發布、已撤回，或連結不正確。請向 Hana Scent Artist 索取有效連結。</section><article id="quote" hidden><div class="eyebrow" style="margin-top:70px">HANA SCENT ARTIST / PRODUCT QUOTATION</div><h1 id="title"></h1><p id="client"></p><p>香氛商品成品單價報價｜價格依確認之容量及瓶器規格提供。</p><h2>商品單價</h2><div class="quote-head"><span>商品品項</span><span>容量</span><span>每瓶單價</span></div><div id="items"></div><p id="noProducts" hidden>此報價尚未設定可發布的容量與單價，請向 Hana Scent Artist 確認。</p><p class="disclaimer">金額為新台幣。實際瓶器款式、最低訂購數量、稅費及交期依正式確認內容為準。</p></article><footer style="margin-top:65px;border-top:1px solid var(--line);padding-top:22px;font-size:12px">HANA SCENT ARTIST · hanascent.com</footer></main><script src="/admin/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
(async()=>{'use strict';const $=x=>document.querySelector(x),txt=(id,value)=>$(id).textContent=value,money=n=>'NT$'+Math.round(Number(n)||0).toLocaleString('zh-TW');const id=new URLSearchParams(location.search).get('id');if(!id||!/^[0-9a-f-]{36}$/i.test(id)){ $('#missing').hidden=false;return;}try{const config=window.HANA_CMS_CONFIG,db=window.supabase.createClient(config.supabaseUrl,config.supabaseAnonKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});const {data,error}=await db.from('fragrance_quote_public').select('client_name,title,data').eq('share_id',id).maybeSingle();if(error||!data){$('#missing').hidden=false;return}const d=data.data||{};txt('#title',data.title);txt('#client','提案對象｜'+data.client_name);const rows=d.items||[];$('#noProducts').hidden=rows.length>0;rows.forEach(i=>{const row=document.createElement('div');row.className='row';const name=document.createElement('span');name.textContent=i.name;const volume=document.createElement('span');volume.textContent=Number(i.ml)>0?Number(i.ml)+' mL':'容量待確認';const total=document.createElement('strong');total.textContent=money(i.unitPrice)+'／瓶';row.append(name,volume,total);$('#items').append(row)});$('#quote').hidden=false}catch(e){$('#missing').hidden=false;console.error(e)}})();

name: Student access security checks
on:
  pull_request:
    paths: ['assets/student-*', 'admin/students/**', 'student-tools/**', 'organ/**', 'supabase/student-*.sql', 'supabase/functions/student-notifications/**', 'tests/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/student-access-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authorization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npm test
      - run: |
          node --check assets/student-auth.js
          node --check assets/student-portal.js
          node --check assets/student-review.js
          node --check student-tools/materials/members.js
          node --check organ/formula-engine.js
          node --check organ/formula-ui.js
          node --check organ/safety-data.js
          node --check organ/sw.js

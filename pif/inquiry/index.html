<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="/" />
  <title>PIF 服務洽詢｜HANA SCENT ARTIST</title>
  <meta name="description" content="PIF 化粧品產品資訊檔案服務洽詢。提供產品資料盤點、文件缺漏確認、法規文件整合與專業單位協作。" />
  <link rel="canonical" href="https://hanascent.com/pif/inquiry/" />
  <link rel="stylesheet" href="/assets/style.css" />
  <style>
    .inquiry-hero{max-width:760px}
    .inquiry-form{width:100%;max-width:820px;margin:28px auto 0}
    .field{margin-bottom:24px}
    .field label,.field legend{display:block;margin-bottom:9px;font-size:14px;font-weight:500;letter-spacing:.04em}
    .field input,.field select,.field textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);background:#fff;padding:13px 14px;font:inherit;color:inherit}
    .field textarea{min-height:140px;resize:vertical}
    .field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px}
    .choices label{display:flex;align-items:center;gap:8px;margin:0;font-size:14px;font-weight:400}
    .choices input{width:auto}
    .form-note{margin-top:18px;color:var(--gray500);font-size:13px;line-height:1.8}
    .success{display:none;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
    @media(max-width:760px){.field-grid,.choices{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="主要導覽"><a class="logo" href="/">HANA SCENT ARTIST</a><div class="nav-links"></div><div class="mobile-note">MENU</div></nav>

  <header class="page-hero">
    <div class="wrap inquiry-hero">
      <p class="eyebrow">PIF INQUIRY</p>
      <h1>PIF 服務洽詢</h1>
      <p class="lead">讓文件與產品，一起長成完整的樣子。</p>
      <p>帶著產品類型、配方與現有文件來，我們先從資料盤點開始。</p>
    </div>
  </header>

  <main>
    <section>
      <div class="wrap">
        <form id="pifInquiry" class="inquiry-form" action="mailto:hello@hanascent.com" method="post" enctype="text/plain">
          <div class="field-grid">
            <div class="field"><label for="name">姓名 *</label><input id="name" name="姓名" required /></div>
            <div class="field"><label for="brand">品牌／公司名稱</label><input id="brand" name="品牌／公司名稱" /></div>
          </div>
          <div class="field-grid">
            <div class="field"><label for="email">Email *</label><input id="email" name="Email" type="email" required /></div>
            <div class="field"><label for="contact">電話／LINE</label><input id="contact" name="電話／LINE" /></div>
          </div>

          <div class="field"><label for="product">產品類型 *</label><input id="product" name="產品類型" placeholder="例：香水、乳液、洗沐、其他化粧品" required /></div>

          <div class="field"><label for="stage">產品目前階段 *</label><select id="stage" name="產品目前階段" required><option value="">請選擇</option><option>尚在開發</option><option>已有配方</option><option>已有樣品</option><option>已量產或販售</option></select></div>

          <div class="field"><label for="manufacturer">是否已有製造廠</label><select id="manufacturer" name="是否已有製造廠"><option value="">請選擇</option><option>有</option><option>尚未</option><option>不確定／需要協助確認</option></select></div>

          <fieldset class="field" style="border:0;padding:0"><legend>目前已有文件</legend><div class="choices"><label><input type="checkbox" name="目前已有文件" value="全成分" />全成分</label><label><input type="checkbox" name="目前已有文件" value="SDS" />SDS</label><label><input type="checkbox" name="目前已有文件" value="IFRA" />IFRA</label><label><input type="checkbox" name="目前已有文件" value="COA" />COA</label><label><input type="checkbox" name="目前已有文件" value="其他" />其他</label><label><input type="checkbox" name="目前已有文件" value="目前沒有" />目前沒有</label></div></fieldset>

          <div class="field"><label for="launch">預計上市時間</label><input id="launch" name="預計上市時間" placeholder="例：2026 年 12 月／尚未確定" /></div>
          <div class="field"><label for="support">希望協助的項目</label><textarea id="support" name="希望協助的項目" placeholder="例：PIF 建檔、文件缺漏確認、檢測／安評協作、整體法規文件盤點"></textarea></div>
          <div class="field"><label for="note">補充說明</label><textarea id="note" name="補充說明"></textarea></div>

          <button class="btn" type="submit">送出 PIF 洽詢</button>
          <p class="form-note">送出後將以 Email 開啟您的預設郵件程式，確認內容後即可寄出。後續將依您提供的產品資訊與現有文件進行初步確認，再與您聯繫。</p>
          <div class="success" id="success"><h2>資料已整理完成。</h2><p>請於開啟的 Email 視窗確認內容並寄出，我們會依案件資料進行初步盤點。</p></div>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer"><div class="footer-grid"><div class="footer-col">HANA SCENT ARTIST</div></div></footer>
  <script>
    document.getElementById('pifInquiry').addEventListener('submit', function(){
      document.getElementById('success').style.display='block';
    });
  </script>
  <script src="/assets/site.js?v=20260917-pif-inquiry"></script>
</body>
</html>
